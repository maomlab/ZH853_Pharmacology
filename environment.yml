# Local analysis environment (macOS / no GPU required).
# Structure QC, interaction fingerprints, cheminformatics, plotting.
#   conda env create -f environment.yml   (or:  make env)
name: zh853mor
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib
  - rdkit
  - mdanalysis
  - biotite
  - mdtraj
  - pdbfixer          # receptor rebuild (Phase 2 prep)
  - openmm            # local for prep/short runs; production runs on the cluster
  - pdb2pqr           # protonation (wraps PROPKA)
  - propka            # pKa prediction (Phase 2 prep)
  - jupyterlab
  # dev tooling
  - ruff
  - mypy
  - pytest
  - pre-commit
  - pip
  - cairosvg          # SVG->PDF for vector figures (RDKit depictions)
  - pip:
      - prolif        # trajectory interaction fingerprints
      - plip          # static protein-ligand interaction profiler
      - molviewspec   # MolViewSpec scenes for MolStar 3D renders
      - svglib        # SVG->PDF fallback
